name: Deploy Financial Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    env:
      APP_DIR: /home/ubuntu/main
      WEB_DIR: /var/www/financial-automation
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name:  Checkout Code
        uses: actions/checkout@v4

      - name:  Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name:  Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name:  Create Backup
        run: |
          ssh root@${{ secrets.SERVER_IP }} '
            if [ -x /root/backup-app.sh ]; then
              /root/backup-app.sh
            else
              echo "Backup script not found - continuing"
            fi
          '

      - name:  Deploy Exact Commit
        run: |
          ssh root@${{ secrets.SERVER_IP }} << ENDSSH
            set -euo pipefail

            APP_DIR="${APP_DIR}"
            DEPLOY_SHA="${DEPLOY_SHA}"

            echo "=========================================="
            echo "Deploying Financial Automation"
            echo "Commit: \$DEPLOY_SHA"
            echo "App:    \$APP_DIR"
            echo "=========================================="

            sudo -u ubuntu -H bash -lc "
              set -euo pipefail

              cd \$APP_DIR

              echo 'Fetching latest main...'
              git fetch origin main

              echo 'Resetting to exact deployment commit...'
              git reset --hard \$DEPLOY_SHA

              CURRENT_SHA=\$(git rev-parse HEAD)

              if [ \"\$CURRENT_SHA\" != \"\$DEPLOY_SHA\" ]; then
                echo 'ERROR: Commit verification failed'
                echo \"Expected: \$DEPLOY_SHA\"
                echo \"Actual:   \$CURRENT_SHA\"
                exit 1
              fi

              echo \"Verified commit: \$CURRENT_SHA\"
            "

            echo "Git deployment completed"
          ENDSSH

      - name:  Install Backend Dependencies
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            sudo -u ubuntu -H bash -lc '
              set -euo pipefail

              cd /home/ubuntu/main/backend

              echo "Installing backend dependencies..."

              if [ -f package-lock.json ]; then
                npm ci --omit=dev --no-audit --no-fund
              else
                npm install --omit=dev --no-audit --no-fund
              fi

              echo "Backend dependencies installed"
            '
          ENDSSH

      - name:  Setup Python Environment
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            sudo -u ubuntu -H bash -lc '
              set -euo pipefail

              cd /home/ubuntu/main/backend

              if [ -f requirements.txt ]; then

                if [ ! -d venv ]; then
                  echo "Creating Python virtual environment..."
                  python3 -m venv venv
                fi

                echo "Installing Python dependencies..."
                venv/bin/pip install --upgrade pip
                venv/bin/pip install -r requirements.txt

              else
                echo "requirements.txt not found - skipping Python dependencies"
              fi
            '
          ENDSSH

      - name:  Build Frontend
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            sudo -u ubuntu -H bash -lc '
              set -euo pipefail

              cd /home/ubuntu/main

              echo "Installing frontend dependencies..."

              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              else
                npm install --no-audit --no-fund
              fi

              echo "Building frontend..."

              export NODE_OPTIONS="--max-old-space-size=2048"

              npm run build

              test -f dist/index.html

              echo "Frontend build successful"
            '
          ENDSSH

      - name:  Publish Frontend
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            APP_DIR="/home/ubuntu/main"
            WEB_DIR="/var/www/financial-automation"

            echo "Publishing frontend..."

            test -d "$APP_DIR/dist"
            test -f "$APP_DIR/dist/index.html"

            mkdir -p "$WEB_DIR"

            rsync -a --delete "$APP_DIR/dist/" "$WEB_DIR/"

            chown -R www-data:www-data "$WEB_DIR"

            echo "Frontend published to $WEB_DIR"
          ENDSSH

      - name:  Restart Backend
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            sudo -u ubuntu -H bash -lc '
              set -euo pipefail

              export PM2_HOME=/home/ubuntu/.pm2

              echo "Restarting backend..."

              pm2 restart financial-backend --update-env

              pm2 save

              pm2 describe financial-backend | grep -E "status|script path|exec cwd"
            '
          ENDSSH

      - name:  Verify Nginx
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            echo "Testing Nginx configuration..."
            nginx -t

            echo "Reloading Nginx..."
            systemctl reload nginx

            echo "Nginx reload successful"
          ENDSSH

      - name:  Production Verification
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -euo pipefail

            APP_DIR="/home/ubuntu/main"
            WEB_DIR="/var/www/financial-automation"

            echo "=========================================="
            echo "PRODUCTION VERIFICATION"
            echo "=========================================="

            echo "1. Git commit:"
            cd "$APP_DIR"
            git rev-parse HEAD

            echo "2. Expected commit:"
            echo "${{ github.sha }}"

            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "ERROR: Wrong commit deployed"
              exit 1
            fi

            echo "3. Frontend:"
            test -f "$WEB_DIR/index.html"
            echo "index.html exists"

            echo "4. Frontend assets:"
            find "$WEB_DIR/assets" -type f | head -10

            echo "5. Backend:"
            sudo -u ubuntu -H bash -lc '
              export PM2_HOME=/home/ubuntu/.pm2
              pm2 describe financial-backend | grep "status"
            '

            echo "6. HTTP:"
            curl -fsS -o /dev/null http://127.0.0.1/

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
